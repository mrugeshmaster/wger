name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      wger-react_ref:
        description: 'Git ref (branch, tag, or SHA) of mrugeshmaster/wger-react to analyze. Defaults to its default branch.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'self-hosted'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          repositories: wger,wger-react

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: wger
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: skyramp-checkout-wger-react
        continue-on-error: true
        with:
          repository: mrugeshmaster/wger-react
          path: wger-react
          fetch-depth: 0
          ref: ${{ inputs['wger-react_ref'] || github.head_ref || github.ref_name }}
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps['skyramp-checkout-wger-react'].outcome == 'failure'
        with:
          repository: mrugeshmaster/wger-react
          path: wger-react
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build wger server image
        uses: docker/build-push-action@v7
        with:
          context: wger
          file: wger/extras/docker/production/Dockerfile
          tags: wger/server:testbot
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: skyramp/testbot@3d8f06f7223f2a7c187e4f3f3ed2b2e074770e8e # v0.11.10
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          workingDirectory: 'wger'
          sutSetupMode: 'none'
          sutSourceWorkflowFile: '.github/workflows/ci.yml'
          relatedRepoPaths: |
            ./wger-react
          targetSetupCommand: 'docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d'
          targetReadyCheckCommand: 'curl -sf http://localhost:8000/api/v2/language/ -o /dev/null'
          targetReadyCheckDiagnosticsCommand: 'docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . ps && docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . logs --tail=50 web'
          targetReadyCheckTimeout: '1800'
          targetTeardownCommand: 'docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v'
          authTokenCommand: 'bash .skyramp/sut/get-auth-token.sh'

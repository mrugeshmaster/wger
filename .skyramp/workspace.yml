# Skyramp Workspace Configuration
workspace:
  repoName: mrugeshmaster/wger
  repoUrl: https://github.com/mrugeshmaster/wger
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  createdAt: "2026-08-28T04:32:10.716Z"
  updatedAt: "2026-08-28T04:32:10.717Z"
services:
  - serviceName: wger-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: http://localhost:8000/api/v2/schema
      authType: token
      authHeader: Authorization
      authScheme: Token
      baseUrl: http://localhost:8000
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml up -d web
      runtime: docker
      dockerNetwork: wger_testbot_network
  - serviceName: wger-react-frontend
    repository: mrugeshmaster/wger-react
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8000
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml up -d web
      runtime: docker
      dockerNetwork: wger_testbot_network
  - serviceName: wger-flutter-frontend
    repository: mrugeshmaster/wger-flutter
    language: javascript
    framework: playwright
    testDirectory: tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      runtime: local
